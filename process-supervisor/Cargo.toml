[package]
name = "process-supervisor"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cooperative process upgrades with inherited listeners and rollback"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = "0.6"
tokio = { version = "1", features = ["net", "rt", "signal", "sync", "time", "io-util", "macros"] }

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
