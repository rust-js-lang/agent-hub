[package]
name = "typed-endpoint"
version = "0.1.0"
edition = "2024"
publish = false
description = "Typed HTTP endpoint contracts and optional Axum adapters"

[features]
axum = ["dep:axum", "dep:serde", "dep:tokio-stream"]

[dependencies]
axum = { version = "0.8", optional = true }
serde = { version = "1", optional = true }
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", features = ["util"] }
