name: Release macOS Apple Silicon

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Generated dashboard JavaScript is committed beside its Rust sources.
      - run: bunx vite build web
      - name: Build and test the release binary
        run: |
          cargo test --release --locked -p cross-agent-message -p protocol
          cargo build --release --locked -p cross-agent-message
          test "$(lipo -archs target/release/cross-agent-message)" = arm64
          target/release/cross-agent-message build-info
      - name: Package and verify the downloadable archive
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf dist/cross-agent-message-aarch64-apple-darwin.tar.gz -C target/release cross-agent-message
          (cd dist && shasum -a 256 cross-agent-message-aarch64-apple-darwin.tar.gz > SHA256SUMS)
          mv web/dist web/dist.built
          trap 'mv web/dist.built web/dist' EXIT
          python3 scripts/check-release.py dist/cross-agent-message-aarch64-apple-darwin.tar.gz
      - name: Tag and publish
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          cat > dist/notes.md <<'NOTES'
          macOS Apple Silicon (`aarch64-apple-darwin`). The archive contains one executable with its dashboard embedded. No Rust or Node installation is needed.

          Download the archive and SHA256SUMS, verify with `shasum -a 256 -c SHA256SUMS`, then extract with `tar -xzf cross-agent-message-aarch64-apple-darwin.tar.gz`. Run `./cross-agent-message --help` to get started.

          Includes protocol compatibility and explicit client updates (#4), plus supervised hub upgrades with rollback and durable delivery (#3). Moving an existing unsupervised hub onto this release requires one cold `serve --replace` using its existing database and listen options; later worker upgrades retain listening sockets. Publishing this release does not replace the live hub.
          NOTES
          gh release create "$TAG" dist/cross-agent-message-aarch64-apple-darwin.tar.gz dist/SHA256SUMS --verify-tag --title "$TAG — macOS Apple Silicon" --notes-file dist/notes.md
