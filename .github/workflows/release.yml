name: Release macOS Apple Silicon

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.3)
        required: true
        type: string
      draft:
        description: Create an unpublished draft for remote deployment acceptance
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      TAG: ${{ inputs.tag }}
      RELEASE_DRAFT: ${{ inputs.draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Validate release
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(uname -m)" = arm64
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag already exists: $TAG" >&2
            exit 1
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      # Generated dashboard JavaScript is committed beside its Rust sources.
      - run: bunx vite build web
      - name: Build and test the release binary
        run: |
          cargo test --release --locked -p agent-hub -p protocol
          cargo build --release --locked -p agent-hub
          test "$(lipo -archs target/release/agent-hub)" = arm64
          target/release/agent-hub build-info
          version=$(target/release/agent-hub build-info | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          test "$TAG" = "v$version"
      - name: Sign with the stable release identifier
        run: |
          # Sign a fresh inode, rather than mutate a binary tests already ran.
          mkdir -p dist/signed
          cp target/release/agent-hub dist/signed/agent-hub
          codesign --force --sign - --identifier io.rust-js.agent-hub dist/signed/agent-hub
          codesign --verify --strict dist/signed/agent-hub
          codesign -d --verbose=2 dist/signed/agent-hub 2>&1 | grep -Fx 'Identifier=io.rust-js.agent-hub'
          # The remote trial needs two distinct images sharing this identifier.
          python3 scripts/make-acceptance-variant.py dist/signed/agent-hub target/release/acceptance-variant
          rm target/release/acceptance-variant
      - name: Package and verify the downloadable archive
        run: |
          mkdir -p dist
          COPYFILE_DISABLE=1 tar -czf dist/agent-hub-aarch64-apple-darwin.tar.gz -C dist/signed agent-hub
          (cd dist && shasum -a 256 agent-hub-aarch64-apple-darwin.tar.gz > SHA256SUMS)
          mv web/dist web/dist.built
          trap 'mv web/dist.built web/dist' EXIT
          python3 scripts/check-release.py dist/agent-hub-aarch64-apple-darwin.tar.gz
      - name: Tag and publish
        run: |
          gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"
          cat > dist/notes.md <<'NOTES'
          macOS Apple Silicon (`aarch64-apple-darwin`). The archive contains one executable with its dashboard embedded. No Rust or Node installation is needed.

          Download the archive and SHA256SUMS, verify with `shasum -a 256 -c SHA256SUMS`, then extract with `tar -xzf agent-hub-aarch64-apple-darwin.tar.gz`. Run `./agent-hub --help` to get started.

          Supervised workers keep the installed executable path across upgrades and rollback, preserving the macOS firewall path (#6). Full HTTP checks report each address as ready, pending, or blocked; an upgrade rolls back if a previously-ready address stops answering. Long database paths use short private control sockets. Protocol compatibility, verified client updates (#4), and durable delivery (#3) remain supported.

          Cooperative handoff drains requests and closes SQLite while keeping the outgoing process alive. The replacement must accept on every previously-ready address; success is reported at activation, and the database-free predecessor is retired after a five-second firewall-lookup grace. Upgrades are serialized through that grace. Before activation, a cooperative failed candidate is drained and parked while the same outgoing process resumes; the failed candidate retires only after rollback readiness and the same grace. A candidate that crashes or will not park must instead be reaped before rollback and may interrupt a remote connection; that exception is logged. Acknowledged writes are never replaced by a backup.

          Cooperative workers exit when their supervisor channel closes, including while parked; they no longer serve as orphans after supervisor death. Normal shutdown reaps both workers and releases all listeners before confirming stop, and explicitly refuses any queued upgrade.

          A ten-second request-exposure deadline includes the outgoing drain. Before launching a candidate, the supervisor reserves startup, a full candidate drain, rollback acceptance and scheduling margin. If the outgoing drain leaves insufficient time, it resumes the same worker and reports the upgrade as deferred. The current CLI exits 75 (try again) with the measured drain and reason. Existing pending-listener retries continue; explicit upgrades require a later retry. Per-address monotonic timestamps and independent acceptance/readiness notifications expose the actual gaps.

          The executable is ad-hoc signed with the fixed identifier `io.rust-js.agent-hub` before checksums are calculated.

          Migration from a v0.1.0/v0.1.1 supervisor requires one announced cold `serve --replace` using the existing database and listen options. A hot transition away from a legacy worker without the handshake may reset or stall a remote request once; zero-failure acceptance starts with the first cooperative outgoing worker, not that legacy transition. Follow the README's concurrent firewall-enabled remote trial before live deployment. This workflow does not restart the live hub.
          NOTES
          draft_args=()
          if [ "$RELEASE_DRAFT" = true ]; then
            draft_args+=(--draft)
            printf '\nDraft candidate: awaiting firewall-enabled remote acceptance.\n' >> dist/notes.md
          fi
          gh release create "$TAG" dist/agent-hub-aarch64-apple-darwin.tar.gz dist/SHA256SUMS --verify-tag --title "$TAG — macOS Apple Silicon" --notes-file dist/notes.md "${draft_args[@]}"
