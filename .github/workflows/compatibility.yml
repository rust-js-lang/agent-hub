name: Protocol compatibility
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: compatibility-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compatibility:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - name: Check Claude runtime adapter
        working-directory: runtime-claude
        run: |
          bun install --frozen-lockfile
          bun run check
          bun test
      - name: Build and test current protocol
        # Handoff deadlines apply to the optimized executable we distribute.
        run: cargo test --release --locked -p typed-endpoint -p sqlite-idempotency -p process-supervisor -p agent-hub -p protocol -p managed-protocol
      - name: Check supervisor and application boundary
        run: |
          rustup component add clippy
          cargo clippy --release --locked -p typed-endpoint -p sqlite-idempotency -p process-supervisor -p agent-hub -p managed-protocol --all-targets -- -D warnings
      - name: Exercise supervisor with an independent TCP application
        run: |
          cargo build --release --locked -p process-supervisor --example echo
          python3 scripts/check-supervisor-example.py --binary target/release/examples/echo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - name: Install pinned compiler tooling dependencies
        working-directory: rust-js
        # Compiler tooling resolves its own workspace packages from here.
        # Its repository hooks are unrelated to this application's CI.
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check JavaScript test dependencies
        run: |
          node --input-type=module -e 'import { createRequire } from "node:module"; const require = createRequire(new URL("./rust-js/tooling/cargo.js", import.meta.url)); require.resolve("@rust-js/typescript"); require.resolve("@rust-js/std");'
      - name: Run shared protocol tests as JavaScript
        # The tool builds the pinned rust-js compiler, then executes the same
        # contract tests with Node; compilation alone is not this check.
        env:
          CARGO_BUILD_JOBS: 2
        run: node rust-js/tooling/cli.js test --package protocol --package typed-endpoint
      - name: Verify typed browser contracts and generated client
        env:
          CARGO_BUILD_JOBS: 2
        run: |
          node rust-js/tooling/cli.js clippy --package dashboard -- -D warnings
          node rust-js/tooling/cli.js build --package dashboard --check
          bun run test:client
      - name: Build the previous release
        shell: bash
        run: |
          previous=$(git tag --merged HEAD^ --sort=-version:refname | while read -r tag; do
            if git cat-file -e "$tag:agent-hub/Cargo.toml" 2>/dev/null; then
              echo "$tag"
              break
            fi
          done)
          if [ -z "$previous" ]; then
            echo "No agent-hub release baseline yet; exercising current/current process contracts."
            echo "PREVIOUS_BINARY=target/release/agent-hub" >> "$GITHUB_ENV"
            exit 0
          fi
          git worktree add --detach target/compat-source "$previous"
          rm -rf target/compat-source/rust-js
          ln -s "$PWD/rust-js" target/compat-source/rust-js
          previous_package=agent-hub
          cargo build --release --locked --manifest-path target/compat-source/Cargo.toml -p "$previous_package" --target-dir target/compat-build
          echo "PREVIOUS_BINARY=target/compat-build/release/$previous_package" >> "$GITHUB_ENV"
      - name: Test both directions against real processes
        run: |
          python3 scripts/check-compatibility.py --current target/release/agent-hub --previous "$PREVIOUS_BINARY"
          python3 scripts/check-idempotency-compatibility.py --current target/release/agent-hub --previous "$PREVIOUS_BINARY"
