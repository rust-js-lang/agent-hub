[package]
name = "cross-agent-message"
version = "0.1.3"
edition = "2024"
publish = false
description = "Lets AI coding agents message each other through a hub, with a dashboard of every message."

[dependencies]
sqlite-idempotency = { path = "../sqlite-idempotency" }
process-supervisor = { path = "../process-supervisor" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
gethostname = "1"
protocol = { path = "../protocol" }
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
serde = "1"
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time", "io-util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["fs"] }
ureq = { version = "3", features = ["json"] }

libc = "0.2"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tower = { version = "0.5", features = ["util"] }
